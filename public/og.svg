<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070c"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="12%" r="68%">
      <stop offset="0" stop-color="#ff6b3d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="12%" cy="88%" r="58%">
      <stop offset="0" stop-color="#4fe0c8" stop-opacity=".1"/>
      <stop offset="1" stop-color="#4fe0c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#tealGlow)"/>

  <g opacity=".5" fill="none" stroke="#ff6b3d">
    <circle cx="930" cy="250" r="180" stroke-opacity=".16"/>
    <circle cx="930" cy="250" r="250" stroke-opacity=".09"/>
    <circle cx="930" cy="250" r="320" stroke-opacity=".05"/>
  </g>

  <path d="M 760 560 C 830 520, 880 470, 920 400 C 960 330, 1000 240, 1075 120"
        fill="none" stroke="#ff6b3d" stroke-width="2" stroke-dasharray="6 9" opacity=".85"/>
  <path d="M 760 560 C 830 520, 880 470, 920 400 C 960 330, 1000 240, 1075 120"
        fill="none" stroke="#ff6b3d" stroke-width="10" opacity=".1"/>

  <circle cx="760" cy="560" r="5" fill="#4fe0c8"/>
  <circle cx="1075" cy="120" r="5" fill="#ff6b3d"/>

  <g transform="translate(1040 150) rotate(36)">
    <path d="M0 -26c13 10 21 24 21 40 0 11-4 20-10 27L0 51l-11-10c-6-7-10-16-10-27 0-16 8-30 21-40Z"
          fill="none" stroke="#ff8f66" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="0" cy="5" r="4" fill="#4fe0c8"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="88" y="138" fill="#ff6b3d" font-size="17" letter-spacing="5">GUIDANCE · NAVIGATION · CONTROL</text>
    <text x="84" y="268" fill="#e9eef6" font-size="82" font-weight="600" letter-spacing="-2">Rocket Flight</text>
    <text x="84" y="355" fill="#e9eef6" font-size="82" font-weight="600" letter-spacing="-2">Control</text>
    <text x="88" y="425" fill="#96a3b7" font-size="27">从方程到飞行 · 火箭飞控学习路线图</text>
    <text x="88" y="474" fill="#637187" font-size="19">7 个阶段 · 42 个检查点 · 12 个实践项目 · 3 个交互工具</text>
    <text x="88" y="548" fill="#4fe0c8" font-size="15" letter-spacing="2">SIMULATE FIRST · FLY LATER</text>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#637187">
    <text x="760" y="592">ALT 12.4 km</text>
    <text x="868" y="592">VEL 842 m/s</text>
    <text x="980" y="592">Q 31.2 kPa</text>
  </g>
</svg>
